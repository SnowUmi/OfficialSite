<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- =========================================================
       SEO & THẺ CHIA SẺ MẠNG XÃ HỘI (OPEN GRAPH - FB / ZALO)
       Hãy sửa lại thông tin bên dưới cho khớp với bạn
  ========================================================== -->
  <title>Nguyễn Minh Anh | Official Links</title>
  <meta name="description" content="Software Engineer & Content Creator. Chia sẻ kiến thức công nghệ, thiết kế giao diện và hành trình phát triển bản thân." />
  <meta name="author" content="Nguyễn Minh Anh" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Open Graph / Facebook / Zalo / Telegram -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://links.tenban.com/" />
  <meta property="og:title" content="Nguyễn Minh Anh | Official Links" />
  <meta property="og:description" content="Kết nối với mình qua các kênh chính thức, dự án cá nhân và thông tin liên hệ công việc." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=1200&q=80" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nguyễn Minh Anh | Official Links" />
  <meta name="twitter:description" content="Kết nối với mình qua các kênh chính thức, dự án cá nhân và thông tin liên hệ công việc." />
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=1200&q=80" />

  <!-- Favicon (Icon trên tab trình duyệt - Có thể thay bằng ./favicon.png) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M22 32a10 10 0 0 1 10-10h6m4 10a10 10 0 0 1-10 10h-6m-1-10h14' fill='none' stroke='%23fff' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Khởi tạo theme ngay lập tức tránh hiện tượng chớp màn hình (FOUC) -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem("linkpage-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        } else {
          const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Nền hiệu ứng ánh sáng nhẹ (Ambient Glow) -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <!-- Thanh công cụ trên cùng (Nút đổi Light/Dark Mode & Nút chia sẻ trang) -->
  <div class="top-controls">
    <button type="button" id="sharePageBtn" class="icon-control-btn" aria-label="Chia sẻ trang này" title="Sao chép liên kết trang">
      <i data-lucide="share-2"></i>
    </button>
    <button type="button" id="themeToggleBtn" class="icon-control-btn" aria-label="Chuyển đổi giao diện Sáng/Tối" title="Đổi giao diện Sáng / Tối">
      <i data-lucide="sun" class="icon-sun"></i>
      <i data-lucide="moon" class="icon-moon"></i>
    </button>
  </div>

  <!-- Nội dung chính căn giữa -->
  <main class="container">
    <article class="profile-card">
      <!-- 1. Header: Thông tin cá nhân -->
      <header class="profile-header">
        <div class="avatar-wrapper">
          <img
            id="profileAvatar"
            src=""
            alt="Ảnh đại diện"
            class="avatar-img"
            width="104"
            height="104"
            loading="eager"
          />
          <span class="status-dot" title="Đang hoạt động"></span>
        </div>

        <div class="name-row">
          <h1 id="profileName" class="profile-name"></h1>
          <!-- Dấu tích xanh xác minh (Verified Badge SVG) -->
          <span id="verifiedBadge" class="verified-badge" title="Tài khoản chính thức" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.71-3.998-3.818-3.998-.47 0-.92.084-1.336.25C14.818 2.415 13.51 1.5 12 1.5s-2.816.917-3.437 2.25c-.415-.165-.866-.25-1.336-.25-2.11 0-3.818 1.79-3.818 4 0 .494.083.964.237 1.4-1.272.65-2.147 2.018-2.147 3.6 0 1.495.782 2.798 1.942 3.486-.02.17-.032.34-.032.514 0 2.21 1.708 4 3.818 4 .47 0 .92-.086 1.335-.25.62 1.334 1.926 2.25 3.437 2.25 1.512 0 2.818-.916 3.437-2.25.415.163.865.248 1.336.248 2.11 0 3.818-1.79 3.818-4 0-.174-.012-.344-.033-.513 1.158-.687 1.943-1.99 1.943-3.484zm-6.616-3.334l-4.334 6.5c-.145.217-.382.334-.625.334-.143 0-.288-.04-.416-.126l-.115-.094-2.415-2.415c-.293-.293-.293-.768 0-1.06s.768-.294 1.06 0l1.77 1.767 3.825-5.74c.23-.345.696-.436 1.04-.207.346.23.44.696.21 1.04z"/>
            </svg>
          </span>
        </div>

        <p id="profileTagline" class="profile-tagline"></p>
        <p id="profileBio" class="profile-bio"></p>
      </header>

      <!-- 2. Thanh Icon Mạng Xã Hội -->
      <nav id="socialBar" class="social-bar" aria-label="Liên kết mạng xã hội"></nav>

      <!-- 3. Danh sách Liên kết chính -->
      <section id="linksList" class="links-list" aria-label="Danh sách liên kết chính"></section>

      <!-- 4. Chân trang -->
      <footer class="profile-footer">
        <p id="footerText"></p>
      </footer>
    </article>

    <noscript>
      <p style="text-align: center; padding: 20px;">
        Vui lòng bật JavaScript trên trình duyệt để hiển thị danh sách liên kết.
      </p>
    </noscript>
  </main>

  <!-- Thông báo Toast khi sao chép -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <i data-lucide="check-circle-2"></i>
    <span id="toastMessage">Đã sao chép!</span>
  </div>

  <!-- Lucide Icons CDN (Tải nhẹ, sắc nét) -->
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <!-- File cấu hình dữ liệu cá nhân -->
  <script src="config.js"></script>
  <!-- Logic xử lý giao diện & tương tác -->
  <script src="app.js"></script>
</body>
</html>
